name: potok-online-balancers

services:
  online-balancers:
    image: potok-online-balancers:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
